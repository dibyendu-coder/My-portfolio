<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="10 6" opacity="0.6" />
  <circle cx="200" cy="200" r="140" fill="#05070d" stroke="url(#accentGrad)" stroke-width="2" />
  <g filter="url(#neon)">
    <text x="200" y="225" font-family="'Space Grotesk', system-ui, sans-serif" font-size="100" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-2">DC</text>
  </g>
  <text x="200" y="275" font-family="'JetBrains Mono', monospace" font-size="14" fill="#00f5ff" text-anchor="middle" letter-spacing="4" opacity="0.85">DIBYENDU CHATTERJEE</text>
</svg>

